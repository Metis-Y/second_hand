spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://localhost:3306/second_hand?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  servlet:
    multipart:
      #单个文件大小
      max-file-size: 10MB
      #总请求数据大小
      max-request-size: 100MB
  data:
    # Redis 配置
    redis:
      host: 192.168.100.130
      port: 6379
      password: 123
      #连索引为1的库，默认是0，0我已经配置了
      #database: 1---目前只有1个库：（
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 5s

  # RabbitMQ 配置（消息队列：下单通知、订单超时取消）
  rabbitmq:
    host: 192.168.100.130
    port: 5672
    username: admin
    password: 123
    virtual-host: second_hand

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl #打印 SQL
    map-underscore-to-camel-case: true #开启驼峰命名
  global-config:
    banner: false

# 通过日志级别控制 SQL 打印，只输出自己 mapper 包的 SQL
logging:
  level:
    com.example.mapper: debug

# JWT 配置
jwt:
  # 密钥：至少 32 位，正式上线前换成自己的一长串随机字符串
  secret: change-me-to-a-long-random-secret-key-2026-please
  # token 有效期（小时）
  expire-hours: 24

# 本地静态图片目录（分类图、商品图、头像等），/uploads/** 会映射到这个目录
file:
  upload-dir: D:/quan_zhan/second_hand/uploads/